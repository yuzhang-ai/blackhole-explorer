<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>视界 · Event Horizon</title>
<meta name="description" content="实时黑洞：Schwarzschild 测地线、吸积盘、三种画法（写实 / 梵高 / 水墨）。">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="view" aria-label="黑洞实时渲染"></canvas>

<header id="brand">
  <div class="cn">视界</div>
  <div class="en">EVENT HORIZON</div>
</header>

<div id="tele" class="mono"></div>
<div id="fps" class="mono" hidden></div>

<nav id="styles" aria-label="画法">
  <button data-style="0" class="on"><span class="n">01</span><span class="cn">写实</span><span class="en">PHYSICAL</span></button>
  <button data-style="1"><span class="n">02</span><span class="cn">梵高</span><span class="en">VAN GOGH</span></button>
  <button data-style="2"><span class="n">03</span><span class="cn">水墨</span><span class="en">INK WASH</span></button>
</nav>

<div id="hint" class="mono">拖动 旋转 · 滚轮 缩放 · 1 2 3 换画法 · 空格 暂停 · C 影院 · F 全屏</div>
<div id="err" hidden></div>

<script src="src/geodesic.js"></script>
<script src="src/glsl-common.js"></script>
<script src="src/glsl-real.js"></script>
<script src="src/glsl-vangogh.js"></script>
<script src="src/glsl-ink.js"></script>
<script src="src/glsl-style.js"></script>
<script src="src/glsl-post.js"></script>
<script src="src/renderer.js"></script>
<script src="src/seal.js"></script>
<script src="src/app.js"></script>
</body>
</html>
